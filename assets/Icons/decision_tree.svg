<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Simplified Black and White Decision Tree -->
  <g stroke="#1E1E1E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Central root stem -->
    <line x1="32" y1="56" x2="32" y2="40" />
    <!-- First branching level -->
    <line x1="32" y1="40" x2="18" y2="28" />
    <line x1="32" y1="40" x2="46" y2="28" />
    <line x1="32" y1="40" x2="32" y2="24" />
    <!-- Upper branching level -->
    <line x1="18" y1="28" x2="10" y2="14" />
    <line x1="18" y1="28" x2="25" y2="15" />
    <line x1="32" y1="24" x2="32" y2="10" />
    <line x1="46" y1="28" x2="39" y2="15" />
    <line x1="46" y1="28" x2="54" y2="14" />
  </g>

  <!-- Decision Nodes -->
  <g fill="#1E1E1E">
    <circle cx="32" cy="56" r="3.5" />
    <circle cx="32" cy="40" r="4.5" />
    <circle cx="18" cy="28" r="4" />
    <circle cx="32" cy="24" r="3.5" />
    <circle cx="46" cy="28" r="4" />
    <circle cx="10" cy="14" r="3.5" />
    <circle cx="25" cy="15" r="3" />
    <circle cx="32" cy="10" r="4" />
    <circle cx="39" cy="15" r="3" />
    <circle cx="54" cy="14" r="3.5" />
  </g>
</svg>
